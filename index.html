<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores para Andrea 🌻</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d1a;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #ffd700; font-size: 2rem; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
    p { color: #e0e0e0; font-size: 1.1rem; max-width: 450px; line-height: 1.6; margin-bottom: 20px; }
    .flower-container { margin: 20px 0; font-size: 5rem; animation: pulse 2s infinite alternate; }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    audio { margin-top: 15px; border-radius: 20px; outline: none; }
  </style>
</head>
<body>
  <h1>¡Estas flores son para ti, Andrea! 🌻✨</h1>
  <div class="flower-container">
    🌸🌻💛🌸🌻
  </div>
  <p>
    Porque una gran amiga merece detalles que le alegren el día. 
    Gracias por tu cariño, tu buena vibra y por ser siempre incondicional.
  </p>
  <audio autoplay loop controls>
    <source src="musica.mp3" type="audio/mpeg">
    Tu navegador no soporta la reproducción de audio.
  </audio>
</body>
</html>
